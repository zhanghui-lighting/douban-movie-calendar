<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电影票根样式测试</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #050505;
    color: #eee;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 60px;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
    color: #999;
    font-size: 13px;
  }
  .controls button {
    background: #1a1a1a;
    border: 1px solid #333;
    color: #ddd;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .controls button:hover { background: #262626; }
  .controls input {
    width: 60px;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #ddd;
    padding: 6px 8px;
    border-radius: 6px;
    text-align: center;
  }

  .ticket {
    width: 100%;
    max-width: 420px;
    background: #0f0f0f;
    border: 1px solid #232323;
    border-radius: 14px;
    padding: 22px 22px 0;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .date-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 4px;
  }
  .date-num {
    font-size: 46px;
    font-weight: 700;
    line-height: 1;
    color: #fff;
  }
  .date-month {
    font-size: 18px;
    color: #ccc;
  }
  .date-sub {
    margin-left: auto;
    text-align: right;
    font-size: 12px;
    color: #888;
  }
  .today-badge {
    display: inline-block;
    margin-top: 2px;
    font-size: 11px;
    color: #ff5a5a;
    border: 1px solid #5a2323;
    background: rgba(255,90,90,0.08);
    padding: 1px 6px;
    border-radius: 3px;
  }

  .title {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    margin: 14px 0 2px;
  }
  .subline {
    font-size: 13px;
    color: #999;
    margin-bottom: 2px;
  }
  .director {
    font-size: 13px;
    color: #999;
    margin-bottom: 14px;
  }

  .poster-wrap {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    background: #1a1a1a;
    margin-bottom: 14px;
  }
  .poster-wrap img {
    width: 100%;
    display: block;
    aspect-ratio: 2 / 3;
    object-fit: cover;
  }

  .rating-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .stars { color: #e8b03c; font-size: 15px; letter-spacing: 1px; }
  .rating-num { color: #e8b03c; font-weight: 600; font-size: 14px; }
  .holiday-badge {
    display: inline-block;
    margin-top: 2px;
    font-size: 11px;
    color: #f0c14b;
    border: 1px solid #5a4a1e;
    background: rgba(240,193,75,0.08);
    padding: 1px 6px;
    border-radius: 3px;
  }
  .poster-wrap .poster-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 2 / 3;
    color: #555;
    font-size: 13px;
    text-align: center;
    padding: 20px;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .tag {
    font-size: 11.5px;
    color: #bbb;
    background: #161616;
    border: 1px solid #2a2a2a;
    padding: 3px 9px;
    border-radius: 4px;
  }

  .quote {
    position: relative;
    font-size: 14px;
    line-height: 1.6;
    color: #ddd;
    padding-left: 16px;
    margin-bottom: 14px;
  }
  .quote::before {
    content: "❝";
    position: absolute;
    left: -4px;
    top: -6px;
    color: #b5342f;
    font-size: 22px;
  }

  .douban-link {
    display: inline-block;
    font-size: 13px;
    color: #6fa8e0;
    text-decoration: none;
    margin-bottom: 18px;
  }
  .douban-link:hover { text-decoration: underline; }

  .perforation {
    position: relative;
    border-top: 1px dashed #333;
    margin: 0 -22px;
  }
  .perforation::before, .perforation::after {
    content: "";
    position: absolute;
    top: -9px;
    width: 18px;
    height: 18px;
    background: #050505;
    border-radius: 50%;
  }
  .perforation::before { left: -9px; }
  .perforation::after { right: -9px; }

  .barcode {
    height: 28px;
    margin: 14px 0;
    background: repeating-linear-gradient(
      90deg,
      #888 0px, #888 2px,
      transparent 2px, transparent 4px,
      #888 4px, #888 5px,
      transparent 5px, transparent 9px,
      #888 9px, #888 12px,
      transparent 12px, transparent 15px
    );
    opacity: 0.6;
  }

  .stub-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #777;
    letter-spacing: 0.5px;
    padding-bottom: 18px;
  }

  #status { color: #666; font-size: 12px; margin-top: 20px; }
</style>
</head>
<body>
  <div class="controls">
    <button id="prevBtn">← 上一天</button>
    <span>第</span>
    <input id="dayInput" type="number" min="1" max="365" value="1">
    <span>天 / 365</span>
    <button id="nextBtn">下一天 →</button>
    <button id="todayBtn">回到今天</button>
  </div>

  <div class="ticket" id="ticket"></div>
  <div id="status">加载中...</div>

  <script>
    const MONTHS = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
    const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];

    let data = [];

    function dayOfYear2026(y, m, d) {
      const start = new Date(Date.UTC(2026, 0, 1));
      const cur = new Date(Date.UTC(y, m - 1, d));
      return Math.round((cur - start) / 86400000) + 1;
    }

    function splitQuoteTags(raw) {
      if (!raw) return { quote: '', tags: [] };
      const tags = [];
      let quote = raw.replace(/【([^】]+)】/g, (m, p1) => { tags.push(p1); return ''; }).trim();
      // 原始数据里经常只留了半边引号（多为结尾），跟我们自己加的装饰引号对不上，统一去掉首尾孤立引号
      quote = quote.replace(/^["'“”‘’「」『』]+|["'“”‘’「」『』]+$/g, '').trim();
      return { quote, tags };
    }

    function renderStars(rating) {
      const parsed = parseFloat(rating);
      const n = Number.isFinite(parsed) ? Math.min(5, Math.max(0, Math.round(parsed / 2))) : 0;
      return '★★★★★☆☆☆☆☆'.slice(5 - n, 10 - n);
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function render(dayNum) {
      const item = data.find(d => d.day_of_year === dayNum);
      const ticket = document.getElementById('ticket');
      if (!item) {
        ticket.innerHTML = '<div style="padding:40px;color:#888;">没有第 ' + dayNum + ' 天的数据</div>';
        return;
      }

      const [y, m, d] = item.date.split('-').map(Number);
      const dateObj = new Date(Date.UTC(y, m - 1, d));
      const weekday = WEEKDAYS[dateObj.getUTCDay()];

      const now = new Date();
      const isToday = dayOfYear2026(now.getFullYear(), now.getMonth() + 1, now.getDate()) === dayNum
        && now.getFullYear() === 2026;

      const { quote, tags } = splitQuoteTags(item.quote);
      const badges = [
        isToday ? '<span class="today-badge">今日放映</span>' : '',
        item.holiday ? `<span class="holiday-badge">${escapeHtml(item.holiday)}</span>` : ''
      ].filter(Boolean).join(' ');

      ticket.innerHTML = `
        <div class="date-row">
          <div class="date-num">${d}</div>
          <div class="date-month">${MONTHS[m - 1]}</div>
          <div class="date-sub">
            ${weekday}
            ${badges ? `<br>${badges}` : ''}
          </div>
        </div>

        <div class="title">${escapeHtml(item.title_cn)}</div>
        <div class="subline">${escapeHtml(item.year || '')} · ${escapeHtml(item.country || '')}</div>
        <div class="director">${escapeHtml(item.director || '')} 导演</div>

        <div class="poster-wrap">
          <img src="./docs${item.poster_local}" alt="${escapeHtml(item.title_cn)}"
               onerror="this.replaceWith(Object.assign(document.createElement('div'), {className:'poster-fallback', textContent:'海报加载失败'}))">
        </div>

        <div class="rating-row">
          <span class="stars">${renderStars(item.rating)}</span>
          <span class="rating-num">${escapeHtml(item.rating || '-')}</span>
        </div>

        ${tags.length ? `<div class="tags">${tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}

        ${quote ? `<div class="quote">${escapeHtml(quote)}</div>` : ''}

        <a class="douban-link" href="${escapeHtml(item.douban_link)}" target="_blank">在豆瓣查看 →</a>

        <div class="perforation"></div>
        <div class="barcode"></div>
        <div class="stub-row">
          <span>SCREEN 01</span>
          <span>NO.${String(item.day_of_year).padStart(3, '0')}</span>
          <span>ADMIT ONE</span>
        </div>
      `;
      document.getElementById('dayInput').value = dayNum;
    }

    let current = 1;

    fetch('./movie-calendar-2026-final.json')
      .then(r => r.json())
      .then(json => {
        data = json;
        const now = new Date();
        let start = 1;
        if (now.getFullYear() === 2026) {
          start = dayOfYear2026(now.getFullYear(), now.getMonth() + 1, now.getDate());
        }
        current = Math.min(Math.max(start, 1), data.length);
        render(current);
        document.getElementById('status').textContent = `共 ${data.length} 天数据`;
      })
      .catch(e => {
        document.getElementById('status').textContent = '加载失败: ' + e.message;
      });

    document.getElementById('prevBtn').onclick = () => { current = Math.max(1, current - 1); render(current); };
    document.getElementById('nextBtn').onclick = () => { current = Math.min(365, current + 1); render(current); };
    document.getElementById('todayBtn').onclick = () => {
      const now = new Date();
      current = now.getFullYear() === 2026 ? dayOfYear2026(now.getFullYear(), now.getMonth() + 1, now.getDate()) : 1;
      render(current);
    };
    document.getElementById('dayInput').addEventListener('change', (e) => {
      const v = Math.min(365, Math.max(1, parseInt(e.target.value, 10) || 1));
      current = v;
      render(current);
    });
  </script>
</body>
</html>
