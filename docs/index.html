<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>片场日历 · 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#151210; --surface:#1f1a16; --surface-2:#26201b;
  --amber:#d9a441; --wine:#7c3438; --cream:#ede4d3; --muted:#9c8f7c; --line:#3a322a;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--cream);font-family:'Space Grotesk',sans-serif;padding-bottom:70px;}
.reel{display:flex;justify-content:space-evenly;padding:10px 0;background:#0f0d0b;border-bottom:1px solid var(--line);}
.reel span{width:9px;height:9px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);}
header{max-width:760px;margin:0 auto;padding:34px 24px 6px;text-align:center;position:relative;}
header .eyebrow{color:var(--muted);font-size:12px;letter-spacing:.08em;}
header h1{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(28px,5vw,42px);margin:6px 0 0;}
.today-btn{position:absolute;right:20px;top:36px;background:var(--surface);border:1px solid var(--line);
  color:var(--amber);font-size:12px;padding:7px 13px;border-radius:20px;cursor:pointer;font-family:'Space Grotesk',sans-serif;}
.today-btn:hover{border-color:var(--amber);}

.hero{max-width:720px;margin:30px auto;background:linear-gradient(160deg,var(--surface),var(--surface-2));
  border:1px solid var(--line);border-radius:4px;padding:26px;display:grid;grid-template-columns:110px 1fr;gap:22px;align-items:start;}
.hero img{width:110px;border-radius:2px;display:block;box-shadow:0 8px 24px rgba(0,0,0,.5);}
.hero .daylabel{color:var(--amber);font-size:12px;letter-spacing:.06em;margin-bottom:6px;}
.hero .filmtitle{font-family:'Fraunces',serif;font-size:24px;font-weight:500;line-height:1.25;}
.hero .orig{color:var(--muted);font-size:13px;margin-top:2px;}
.hero .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;}
.pill{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pill.holiday{color:var(--amber);border-color:var(--amber);}
.rating{color:var(--amber);font-family:'Fraunces',serif;font-size:15px;}
.hero .quote{margin-top:12px;font-size:14px;line-height:1.75;opacity:.92;}
.hero a.dlink{display:inline-block;margin-top:12px;font-size:12px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line);}
.hero a.dlink:hover{color:var(--amber);border-color:var(--amber);}

.tabs{max-width:960px;margin:0 auto;padding:0 20px;display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;}
.tabs button{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);color:var(--muted);
  font-family:'Space Grotesk',sans-serif;font-size:13px;padding:8px 14px;border-radius:3px;cursor:pointer;}
.tabs button.active{background:var(--wine);color:var(--cream);border-color:var(--wine);}

.grid-wrap{max-width:960px;margin:18px auto 0;padding:0 20px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;}
.cell{position:relative;height:118px;border-radius:3px;overflow:hidden;cursor:pointer;border:1px solid var(--line);background:var(--surface);}
.cell img{width:100%;height:100%;object-fit:cover;opacity:.55;transition:opacity .2s;}
.cell:hover img{opacity:.85;}
.cell .num{position:absolute;top:6px;left:7px;font-family:'Fraunces',serif;font-size:15px;color:var(--cream);text-shadow:0 1px 3px rgba(0,0,0,.8);}
.cell.selected{outline:2px solid var(--wine);}
.cell.today{outline:2px solid var(--amber);}
.cell.today.selected{outline:2px solid var(--amber);box-shadow:inset 0 0 0 2px var(--wine);}
.cell .htag{position:absolute;bottom:6px;left:7px;right:7px;font-size:9px;color:var(--amber);text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.detail{max-width:720px;margin:22px auto 0;padding:0 20px;scroll-margin-top:20px;}
.detail-card{background:linear-gradient(160deg,var(--surface),var(--surface-2));border:1px solid var(--line);
  border-radius:4px;padding:26px;display:grid;grid-template-columns:120px 1fr;gap:22px;animation:rise .35s ease both;}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.detail-card img{width:120px;border-radius:2px;box-shadow:0 8px 24px rgba(0,0,0,.5);}

footer{max-width:720px;margin:50px auto 0;padding:20px 24px 0;border-top:1px solid var(--line);
  color:var(--muted);font-size:12px;line-height:1.7;text-align:center;}

@media (max-width:480px){
  .hero, .detail-card{grid-template-columns:88px 1fr;padding:18px;gap:16px;}
  .hero img, .detail-card img{width:88px;}
  .today-btn{position:static;display:inline-block;margin-top:10px;}
}
</style>
</head>

<div class="reel"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>

const TODAY_DAY = (function(){
  const today = new Date();
  const start = new Date(today.getFullYear(), 0, 0);
  const diff = today - start;
  const oneDay = 1000 * 60 * 60 * 24;
  const day = Math.floor(diff / oneDay);
  return Math.min(Math.max(day,1), FILMS.length);
})();

function posterSrc(f){ return f.poster || ""; }
function ratingStars(r){ return r ? ("★ " + r) : ""; }

function tagsHtml(f){
  const tags = [];
  if(f.holiday) tags.push('<span class="pill holiday">' + f.holiday + '</span>');
  f.honors.forEach(h => tags.push('<span class="pill" title="'+h+'">' + h + '</span>'));
  return tags.join('');
}

function cardInner(f, todayLabel){
  return `
    <img src="${posterSrc(f)}" alt="${f.title}" loading="lazy">
    <div>
      <div class="daylabel">${f.date}${todayLabel ? ' · 今日' : ''}</div>
      <div class="filmtitle">${f.title}</div>
      ${f.orig ? '<div class="orig">' + f.orig + '</div>' : ''}
      <div class="row">${f.rating ? '<span class="rating">' + ratingStars(f.rating) + '</span>' : ''}${tagsHtml(f)}</div>
      ${f.quote ? '<div class="quote">' + f.quote + '</div>' : ''}
      ${f.link ? '<a class="dlink" href="'+f.link+'" target="_blank" rel="noopener">在豆瓣查看 →</a>' : ''}
    </div>
  `;
}

function renderHero(day){
  document.getElementById('hero').innerHTML = cardInner(FILMS[day-1], true);
}

function monthsFromData(){
  const months = {};
  FILMS.forEach(f => {
    const m = f.date.slice(0,7);
    if(!months[m]) months[m] = [];
    months[m].push(f);
  });
  return months;
}
const MONTHS = monthsFromData();
const MONTH_KEYS = Object.keys(MONTHS).sort();
const MONTH_LABELS = ["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
const TODAY_MONTH = FILMS[TODAY_DAY-1].date.slice(0,7);

let currentMonth = MONTH_KEYS.includes(TODAY_MONTH) ? TODAY_MONTH : MONTH_KEYS[0];
let selectedDay = TODAY_DAY;

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = MONTH_KEYS.map((k,i) =>
    `<button data-m="${k}" class="${k===currentMonth?'active':''}">${MONTH_LABELS[i]}</button>`
  ).join('');
  tabs.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentMonth = btn.dataset.m;
      renderTabs();
      renderGrid();
    });
  });
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const list = MONTHS[currentMonth];
  grid.innerHTML = list.map(f => {
    const isToday = f.day === TODAY_DAY;
    const isSel = f.day === selectedDay;
    return `
    <div class="cell ${isSel?'selected':''} ${isToday?'today':''}" data-day="${f.day}">
      <img src="${posterSrc(f)}" alt="" loading="lazy">
      <div class="num">${String(parseInt(f.date.slice(8,10),10)).padStart(2,'0')}</div>
      ${f.holiday ? '<div class="htag">'+f.holiday+'</div>' : ''}
    </div>`;
  }).join('');
  grid.querySelectorAll('.cell').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      selectedDay = parseInt(cell.dataset.day,10);
      renderGrid();
      renderDetail(selectedDay);
      document.getElementById('detail').scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

function renderDetail(day){
  document.getElementById('detail').innerHTML = `<div class="detail-card">${cardInner(FILMS[day-1], false)}</div>`;
}

document.getElementById('todayBtn').addEventListener('click', ()=>{
  currentMonth = TODAY_MONTH;
  selectedDay = TODAY_DAY;
  renderTabs();
  renderGrid();
  renderDetail(TODAY_DAY);
  window.scrollTo({top:0, behavior:'smooth'});
});

renderHero(TODAY_DAY);
renderTabs();
renderGrid();
renderDetail(TODAY_DAY);
</script>
