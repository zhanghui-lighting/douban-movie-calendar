<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每帧 · 2026</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12160f; --surface:#1b2116; --surface-2:#232b1c;
  --amber:#8ba888; --wine:#556b52; --cream:#eef1ea; --muted:#9db597; --line:#2c3427;
  --gold:#d9b04c; --gold-glow:rgba(217,176,76,.65);
  --sys-font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--sys-font);padding-bottom:30px;position:relative;}

/* film grain overlay */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.09;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:998;
  background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.35) 100%);
}

.reel{display:flex;justify-content:space-evenly;padding:10px 0;background:#0f0d0b;border-bottom:1px solid var(--line);}
.reel span{width:9px;height:9px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);}
.topbar{max-width:760px;margin:0 auto;padding:12px 24px 0;text-align:right;}
.today-btn{background:var(--surface);border:1px solid var(--line);min-height:44px;min-width:44px;
  color:var(--amber);font-size:12px;padding:7px 16px;border-radius:22px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
.today-btn:hover{border-color:var(--amber);}
.panel-title{text-align:center;padding:0 20px 16px;}
.panel-title .eyebrow{color:var(--muted);font-size:11px;letter-spacing:.08em;}
.panel-title h1{font-family:var(--sys-font);font-weight:800;font-size:clamp(22px,4vw,30px);margin:4px 0 0;}

/* 年度胶片计数器 */
.counter-wrap{max-width:720px;margin:14px auto 0;padding:0 24px;display:flex;align-items:center;gap:14px;}
.counter-label{font-size:11px;color:var(--muted);letter-spacing:.05em;white-space:nowrap;}
.counter{display:flex;gap:2px;background:#0f0d0b;border:1px solid var(--line);border-radius:8px;padding:4px 6px;}
.counter .digit{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;color:var(--amber);
  background:#000;width:16px;text-align:center;border-radius:3px;}
.counter-frac{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);white-space:nowrap;}
.counter-track{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden;}
.counter-fill{height:100%;background:var(--amber);}

/* 票根卡片：大图+顶部信息条 */
.ticket{max-width:400px;margin:14px auto;position:relative;touch-action:pan-y;}
.ticket-inner{background:linear-gradient(160deg,var(--surface),var(--surface-2));border:1px solid var(--line);
  border-radius:22px;overflow:hidden;position:relative;}
.ticket-notch{position:absolute;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;
  background:var(--bg);z-index:2;}
.ticket-notch.left{left:-9px;}
.ticket-notch.right{right:-9px;}
.ticket-head{padding:16px 24px 10px;position:relative;z-index:1;}
.ticket-head .head-top{display:flex;gap:14px;align-items:flex-start;}
.ticket-head .daynum{font-family:var(--sys-font);font-weight:800;font-size:52px;line-height:1;color:var(--amber);}
.ticket-head .midcol{padding-top:6px;}
.ticket-head .midcol .month{font-size:19px;font-weight:700;color:var(--cream);line-height:1.4;}
.ticket-head .midcol .weekday{font-size:13px;color:var(--muted);line-height:1.4;}
.head-title{margin-top:12px;}
.filmtitle{font-family:var(--sys-font);font-size:19px;font-weight:700;line-height:1.4;}
.orig{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.5;}
.ticket-poster-frame{padding:0;}
.ticket-poster{position:relative;width:100%;aspect-ratio:7/10;overflow:hidden;background:#000;}
.ticket-poster .poster-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:blur(20px) brightness(.45);transform:scale(1.15);}
.ticket-poster img.poster-img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;display:block;cursor:pointer;transition:filter .35s ease;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
.ticket-poster img.negative{filter:invert(1) hue-rotate(180deg) sepia(.3) saturate(1.4);}
.ticket-info{padding:10px 24px 2px;position:relative;z-index:1;}
.tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.bottom-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;}
.rating-block{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.rating-block .rating-label{font-size:11px;color:var(--muted);}
.rating-block .rating-num{font-family:var(--sys-font);font-weight:800;font-size:30px;color:var(--gold);text-shadow:0 0 10px var(--gold-glow);line-height:1;}
.rating-block .stars{font-size:13px;}

.daylabel{display:none;}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;align-items:center;}
.pill{font-size:13px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pill.holiday{color:var(--amber);border-color:var(--amber);}
.rating{color:var(--gold);font-family:var(--sys-font);font-size:15px;text-shadow:0 0 10px var(--gold-glow);}
.stars{color:var(--gold);text-shadow:0 0 8px var(--gold-glow);}
.quote{margin-top:12px;font-size:14px;line-height:1.75;opacity:.92;}
.quote::before{content:"「";color:var(--amber);}
.quote::after{content:"」";color:var(--amber);}
a.dlink{display:inline-block;margin-top:12px;font-size:12px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line);}
a.dlink:hover{color:var(--amber);border-color:var(--amber);}
@media (max-width:680px){ a.dlink{display:none;} }

.ticket-tear{display:flex;align-items:center;gap:8px;padding:0 20px;position:relative;}
.ticket-tear .dash{flex:1;border-top:2px dashed var(--line);}
.barcode{display:flex;gap:2px;align-items:flex-end;height:20px;}
.barcode span{display:block;background:var(--muted);opacity:.5;}
.ticket-foot{display:flex;justify-content:space-between;align-items:center;padding:12px 26px 16px;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;}

/* 明日预告 */
.preview-strip{margin-top:2px;border-top:1px solid var(--line);padding:10px 26px;display:flex;align-items:center;gap:12px;
  background:rgba(0,0,0,.15);}
.preview-strip .thumb{width:36px;height:52px;border-radius:8px;object-fit:cover;filter:blur(2.5px) brightness(.6);opacity:.8;}
.preview-strip .txt{font-size:11px;color:var(--muted);letter-spacing:.03em;}
.preview-strip .txt b{color:var(--amber);font-weight:500;}

.tabs-wrap{position:relative;max-width:960px;margin:0 auto;}
.tabs{padding:0 20px;display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;}
.tabs::-webkit-scrollbar{display:none;}
.tabs button{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);color:var(--muted);min-height:44px;
  font-size:13px;padding:8px 16px;border-radius:14px;cursor:pointer;}
.tabs button.active{background:var(--wine);color:var(--cream);border-color:var(--wine);}
.tabs-wrap::after{content:"";position:absolute;right:0;top:0;bottom:6px;width:36px;pointer-events:none;
  background:linear-gradient(90deg, transparent, var(--bg));}

.calendar-toggle{display:none;}
.calendar-close{display:none;}

@media (max-width:680px){
  .calendar-toggle{
    display:block;margin:18px auto 0;max-width:200px;background:var(--surface);border:1px solid var(--line);
    color:var(--amber);font-size:13px;padding:10px 16px;border-radius:20px;cursor:pointer;text-align:center;
  }
  .calendar-panel{display:none;}
  .calendar-panel.open{
    display:block;position:fixed;inset:0;z-index:1000;background:var(--bg);overflow-y:auto;padding:20px 0 40px;
  }
  .calendar-close{
    display:block;position:sticky;top:0;background:var(--bg);z-index:2;text-align:right;padding:0 20px 10px;
  }
  .calendar-close button{background:var(--surface);border:1px solid var(--line);color:var(--cream);min-height:44px;min-width:44px;
    font-size:13px;padding:8px 16px;border-radius:22px;cursor:pointer;}
}

.grid-wrap{max-width:960px;margin:18px auto 0;padding:0 20px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;}
.cell{position:relative;height:118px;border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid var(--line);background:var(--surface);
  padding:0;font:inherit;color:inherit;text-align:left;display:block;-webkit-appearance:none;appearance:none;}
.cell img{width:100%;height:100%;object-fit:cover;opacity:.55;transition:opacity .2s, filter .35s;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
.cell:hover img{opacity:.85;}
.cell img.negative{filter:invert(1) hue-rotate(180deg) sepia(.3) saturate(1.4);}
.cell .num{position:absolute;top:6px;left:7px;font-family:var(--sys-font);font-size:15px;color:var(--cream);text-shadow:0 1px 3px rgba(0,0,0,.8);}
.cell.selected{outline:2px solid var(--wine);}
.cell.today{outline:2px solid var(--amber);}
.cell.future{cursor:default;}
.cell.future img{filter:grayscale(1) brightness(.35);}
.cell.future .lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;opacity:.7;}
@keyframes shakeX{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-6px);}
  75%{transform:translateX(6px);}
}
.locked-shake{animation:shakeX .35s ease;}
@keyframes reboundX{
  0%{transform:translateX(0);}
  35%{transform:translateX(-16px);}

const TODAY_DAY = (function(){
  const today = new Date();
  const start = new Date(today.getFullYear(), 0, 0);
  const diff = today - start;
  const oneDay = 1000 * 60 * 60 * 24;
  const day = Math.floor(diff / oneDay);
  return Math.min(Math.max(day,1), FILMS.length);
})();

/* ---- Web Audio 合成翻页/过片咔哒声 ---- */
let audioCtx = null;
function playClick(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    // 噪声脉冲
    const bufferSize = audioCtx.sampleRate * 0.04;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * Math.pow(1-i/bufferSize, 3); }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = "bandpass"; noiseFilter.frequency.value = 1800; noiseFilter.Q.value = 0.8;
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.35, t);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, t+0.05);
    noise.connect(noiseFilter).connect(noiseGain).connect(audioCtx.destination);
    noise.start(t); noise.stop(t+0.05);
    // 低频闷响
    const osc = audioCtx.createOscillator();
    osc.type = "sine"; osc.frequency.setValueAtTime(120, t);
    osc.frequency.exponentialRampToValueAtTime(60, t+0.08);
    const oscGain = audioCtx.createGain();
    oscGain.gain.setValueAtTime(0.25, t);
    oscGain.gain.exponentialRampToValueAtTime(0.001, t+0.09);
    osc.connect(oscGain).connect(audioCtx.destination);
    osc.start(t); osc.stop(t+0.09);
  }catch(e){}
}

function posterSrc(f){ return f.poster ? "." + f.poster : ""; }
function posterThumbSrc(f){ const p = f.poster_thumb || f.poster || ""; return p ? "." + p : ""; } // 月历小格优先用小图，暂无小图时退回原图
function ratingStars(r){
  if(!r) return "";
  const n = Math.round(parseFloat(r)/2);
  let s = "";
  for(let i=0;i<5;i++) s += i<n ? "★" : "☆";
  return s;
}
function tagsHtml(f){
  const tags = [];
  if(f.holiday) tags.push('<span class="pill holiday">' + f.holiday + '</span>');
  f.honors.forEach(h => tags.push('<span class="pill" title="'+h+'">' + h + '</span>'));
  return tags.join('');
}

function barcodeHtml(){
  let bars = "";
  const widths = [2,1,3,1,2,4,1,2,1,3,2,1,4,1,2,3,1,2,1,3,2,4,1,2];
  widths.forEach((w,i)=>{
    const h = 8 + (i%4)*3;
    bars += `<span style="width:${w}px;height:${h}px;"></span>`;
  });
  return bars;
}

const WEEKDAYS = ["周日","周一","周二","周三","周四","周五","周六"];
function cleanQuote(q){
  return (q || "").replace(/——/g, "").replace(/^\s+/,'').trim();
}

function ticketHtml(f, opts){
  opts = opts || {};
  const nextF = FILMS[f.day % FILMS.length]; // 明日（跨年循环）
  const dt = new Date(f.date + 'T00:00:00');
  const monthNum = dt.getMonth() + 1;
  const wd = WEEKDAYS[dt.getDay()];
  const quote = cleanQuote(f.quote);
  return `
    <div class="ticket-inner">
      <div class="ticket-head">
        <div class="head-top">
          <div class="daynum">${String(dt.getDate()).padStart(2,'0')}</div>
          <div class="midcol">
            <div class="month">${monthNum}月</div>
            <div class="weekday">${wd}${opts.today ? ' · 今日放映' : ''}</div>
          </div>
        </div>
        <div class="head-title">
          <div class="filmtitle">${f.title}</div>
          ${(f.year || f.country) ? '<div class="orig">' + [f.year, f.country].filter(Boolean).join(' · ') + '</div>' : ''}
          ${f.director ? '<div class="orig">' + f.director + ' 导演</div>' : ''}
        </div>
      </div>
      <div class="ticket-poster-frame">
        <div class="ticket-poster">
          <img src="${posterSrc(f)}" alt="" aria-hidden="true" class="poster-bg">
          <img src="${posterSrc(f)}" alt="${f.title}" ${opts.today ? 'loading="eager" fetchpriority="high"' : 'loading="lazy"'} class="poster-img">
        </div>
      </div>
      <div class="ticket-info">
        ${quote ? '<div class="quote">' + quote + '</div>' : ''}
        ${tagsHtml(f) ? '<div class="tagrow">' + tagsHtml(f) + '</div>' : ''}
        <div class="bottom-row">
          ${f.link ? '<a class="dlink" href="'+f.link+'" target="_blank" rel="noopener">在豆瓣查看 →</a>' : '<span></span>'}
          ${f.rating ? '<div class="rating-block"><span class="rating-label">豆瓣评分</span><span class="rating-num">' + f.rating + '</span><span class="stars">' + ratingStars(f.rating) + '</span></div>' : ''}
        </div>
      </div>
      <div class="ticket-tear"><div class="ticket-notch left"></div><div class="dash"></div><div class="barcode">${barcodeHtml()}</div><div class="dash"></div><div class="ticket-notch right"></div></div>
      <div class="ticket-foot"><span>SCREEN 01</span><span>NO.${String(f.day).padStart(3,'0')}</span><span>ADMIT ONE</span></div>
      ${opts.today ? `
      <div class="preview-strip">
        <img class="thumb" src="${posterSrc(nextF)}" alt="">
        <div class="txt">明日预告 · <b>${nextF.title}</b></div>
      </div>` : ''}
    </div>
  `;
}

function bindNegativeToggle(container){
  function findImgFor(el){
    if(el.classList && el.classList.contains('cell')) return el.querySelector('img');
    return el.querySelector('img.poster-img');
  }
  let pressTimer = null, startX = 0, startY = 0, pendingScope = null;
  container.addEventListener('pointerdown', (e)=>{
    if(e.target.closest('a, button')) return;
    const cell = e.target.closest('.cell');
    const scope = cell || container;
    startX = e.clientX; startY = e.clientY; pendingScope = scope;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(()=>{
      const img = findImgFor(scope);
      if(img){
        img.classList.add('negative');
        scope.dataset.pressing = '1';
        dismissOnboardHint();
      }
    }, 300); // 真正的"长按"：按住300ms才触发，避免轻触/滑动误触
  });
  container.addEventListener('pointermove', (e)=>{
    if(!pendingScope) return;
    const dx = Math.abs(e.clientX - startX), dy = Math.abs(e.clientY - startY);
    if(dx > 10 || dy > 10){ clearTimeout(pressTimer); pendingScope = null; } // 手指在动=在滑动,不是长按,取消计时
  });
  const release = ()=>{
    clearTimeout(pressTimer);
    pendingScope = null;
    const scopes = [container, ...container.querySelectorAll('[data-pressing="1"]')];
    scopes.forEach(scope=>{
      if(scope.dataset && scope.dataset.pressing === '1'){
        const img = findImgFor(scope);
        if(img) img.classList.remove('negative');
        delete scope.dataset.pressing;
      }
    });
  };
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
}

let heroDay = TODAY_DAY;
let animsOK = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function renderHero(day, opts){
  opts = opts || {};
  heroDay = day;
  const el = document.getElementById('hero');
  el.innerHTML = ticketHtml(FILMS[day-1], {today: day === TODAY_DAY});
  if(opts.toast){
    const dateLabel = FILMS[day-1].date.slice(5).replace('-','月') + '日';
    showToast(dateLabel + ' · ' + opts.toast, 1000);
  }
}

function goOlder(){
  if(heroDay > 1){
    playClick();
    renderHero(heroDay - 1, {toast:'前一天'});
    dismissOnboardHint();
  }
}
function goNewer(){
  if(heroDay < TODAY_DAY){
    playClick();
    renderHero(heroDay + 1, {toast:'较新一天'});
    dismissOnboardHint();
  }else{
    const heroEl = document.getElementById('hero');
    reboundShake(heroEl);
    showToast('明日尚未放映', 1200);
  }
}

function bindSwipe(container, {onLeft, onRight}){
  let startX=0, startY=0, tracking=false;
  container.addEventListener('pointerdown', (e)=>{
    if(e.target.closest('a,button')) return;
    startX = e.clientX; startY = e.clientY; tracking = true;
  });
  container.addEventListener('pointerup', (e)=>{
    if(!tracking) return;
    tracking = false;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    // 横向位移需明显超过纵向位移才判定为切片，纵向占优时不拦截，交给页面正常滚动
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx > 0) onRight && onRight();
      else onLeft && onLeft();
    }
  });
  container.addEventListener('pointercancel', ()=>{ tracking = false; });
}

function lockedShake(el){
  el.classList.add('locked-shake');
  setTimeout(()=>el.classList.remove('locked-shake'), 400);
}

function reboundShake(el){
  if(!animsOK){ return; } // 减少动态效果时跳过回弹，但功能（提示）依然生效
  const inner = el.querySelector('.ticket-inner') || el;
  inner.classList.add('rebound');
  setTimeout(()=>inner.classList.remove('rebound'), 320);
}

function dismissOnboardHint(){
  const hint = document.getElementById('onboardHint');
  if(hint){ hint.classList.remove('show'); }
  localStorage.setItem('onboard_hint_seen', '1');
}

function showOnboardHint(){
  if(localStorage.getItem('onboard_hint_seen')) return;
  let el = document.getElementById('onboardHint');
  if(!el){
    el = document.createElement('div');
    el.id = 'onboardHint';
    el.className = 'toast onboard-hint';
    el.textContent = '左右滑动换片 · 按住海报查看负片';
    document.body.appendChild(el);
  }
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(dismissOnboardHint, 4000);
}

function renderCounter(day){
  const total = FILMS.length;
  const s = String(day).padStart(3,'0');
  document.getElementById('counter').innerHTML = s.split('').map(d=>`<span class="digit">${d}</span>`).join('');
  document.getElementById('counterFrac').textContent = day + ' / ' + total + ' 格';
  document.getElementById('counterFill').style.width = (day/total*100).toFixed(1) + '%';
}

function monthsFromData(){
  const months = {};
  FILMS.forEach(f => {
    const m = f.date.slice(0,7);
    if(!months[m]) months[m] = [];
    months[m].push(f);
  });
  return months;
}
const MONTHS = monthsFromData();
const MONTH_KEYS = Object.keys(MONTHS).sort();
const MONTH_LABELS = ["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
const TODAY_MONTH = FILMS[TODAY_DAY-1].date.slice(0,7);

let currentMonth = MONTH_KEYS.includes(TODAY_MONTH) ? TODAY_MONTH : MONTH_KEYS[0];
let selectedDay = null; // 初始不选中任何一天，避免和顶部今日卡片重复

function renderTabs(scrollTo){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = MONTH_KEYS.map((k,i) =>
    `<button data-m="${k}" class="${k===currentMonth?'active':''}">${MONTH_LABELS[i]}</button>`
  ).join('');
  tabs.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentMonth = btn.dataset.m;
      playClick();
      renderTabs(true);
      renderGrid();
    });
  });
  if(scrollTo){
    const activeBtn = tabs.querySelector('button.active');
    if(activeBtn) activeBtn.scrollIntoView({inline:'center', block:'nearest'});
  }
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const list = MONTHS[currentMonth];
  grid.innerHTML = list.map(f => {
    const isToday = f.day === TODAY_DAY;
    const isSel = f.day === selectedDay;
    const isFuture = f.day > TODAY_DAY;
    const md = f.date.slice(5).replace('-','月') + '日';
    const label = isFuture ? `${md}，尚未放映` : `${md}，《${f.title}》${isToday ? '，今日' : ''}`;
    return `
    <button type="button" class="cell ${isSel?'selected':''} ${isToday?'today':''} ${isFuture?'future':''}"
      data-day="${f.day}" data-future="${isFuture?1:0}" data-date="${md}"
      aria-label="${label}" aria-current="${isToday?'date':'false'}" aria-pressed="${isSel?'true':'false'}">
      <img src="${posterThumbSrc(f)}" alt="" loading="lazy" class="poster-img">
      ${isFuture ? '<div class="lock" aria-hidden="true">🔒</div>' : ''}
      <div class="num">${String(parseInt(f.date.slice(8,10),10)).padStart(2,'0')}</div>
      ${(f.holiday && !isFuture) ? '<div class="htag">'+f.holiday+'</div>' : ''}
    </button>`;
  }).join('');
  grid.querySelectorAll('.cell').forEach(cell=>{
    cell.addEventListener('click', ()=>{
      if(cell.dataset.future === '1'){
        lockedShake(cell);
        showToast(cell.dataset.date + '尚未放映');
        return;
      }
      selectedDay = parseInt(cell.dataset.day,10);
      playClick();
      renderGrid();
      renderDetail(selectedDay);
      document.getElementById('calPanel').classList.remove('open');
      document.getElementById('detail').scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

function showToast(text, duration){
  duration = duration || 1500;
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), duration);
}

function renderDetail(day){
  const el = document.getElementById('detail');
  if(day == null){ el.innerHTML = ""; return; }
  el.innerHTML = ticketHtml(FILMS[day-1], {today:false});
}

document.getElementById('calToggle').addEventListener('click', ()=>{
  document.getElementById('calPanel').classList.add('open');
  renderTabs(true); // 面板刚打开时才有真实布局，这时候滚动到当前月才生效
});
document.getElementById('calClose').addEventListener('click', ()=>{
  document.getElementById('calPanel').classList.remove('open');
});

document.getElementById('todayBtn').addEventListener('click', ()=>{
  currentMonth = TODAY_MONTH;
  selectedDay = null;
  playClick();
  renderHero(TODAY_DAY);
  renderTabs(true);
  renderGrid();
  renderDetail(null);
  document.getElementById('calPanel').classList.remove('open');
  window.scrollTo({top:0, behavior:'smooth'});
});

// 一次性绑定长按变负片 + 滑动手势，避免每次重新渲染时重复叠加监听器
bindNegativeToggle(document.getElementById('hero'));
bindNegativeToggle(document.getElementById('detail'));
bindNegativeToggle(document.getElementById('grid'));
bindSwipe(document.getElementById('hero'), {
  onRight: goOlder,   // 右滑 = 看前一天
  onLeft: goNewer     // 左滑 = 看较新一天，今天时会被挡住
});

document.addEventListener('keydown', (e)=>{
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA') return; // 输入框聚焦时不拦截方向键
  if(e.key === 'ArrowLeft'){ goOlder(); }
  else if(e.key === 'ArrowRight'){ goNewer(); }
});

renderCounter(TODAY_DAY);
renderHero(TODAY_DAY);
renderTabs(true);
renderGrid();
renderDetail(null);
showOnboardHint();
</script>
</body>
</html>
